<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Client Login – WeRecruit4You</title>
  <style>
    body { font-family: Inter, sans-serif; background: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 400px; max-width: 90%; }
    h2 { color: #e02424; margin-bottom: 24px; }
    p { color: #555; margin-bottom: 24px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
    button { width: 100%; padding: 12px; background: #e02424; color: white; border: none; border-radius: 8px; font-weight: 600; margin-top: 16px; cursor: pointer; }
    .back { display: block; margin-top: 20px; color: #0077cc; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Client Portal</h2>
    <p>Access your matched candidates, post jobs, and manage hires.</p>
    <input type="email" placeholder="Company email" />
    <input type="password" placeholder="Password" />
    <button>Login</button>
    <a href="index.html" class="back">← Back to homepage</a>
  </div>
</body>
</html>
